# Pages CMS configuration — https://pagescms.org
# Editors manage everything below from a visual form at app.pagescms.org.
# Saving commits content.json (and any uploaded photos) to GitHub,
# which triggers an automatic Vercel redeploy.

media:
  input: assets/images
  output: assets/images

content:
  - name: content
    label: Website content
    type: file
    path: content.json
    fields:
      - name: site
        label: SEO / page title
        type: object
        fields:
          - { name: metaTitle, label: Browser title, type: string }
          - { name: metaDescription, label: Search description, type: text }

      - name: hero
        label: Hero (top banner)
        type: object
        fields:
          - { name: eyebrow, label: Small label above heading, type: string }
          - { name: headingLead, label: Heading — part 1, type: string }
          - { name: headingHighlight, label: Heading — highlighted part (amber), type: string }
          - { name: headingTail, label: Heading — part 3, type: string }
          - { name: subtext, label: Sub-text, type: text }
          - { name: primaryCta, label: Main button text, type: string }
          - { name: secondaryCta, label: Secondary button text, type: string }
          - name: badges
            label: Key numbers
            type: object
            list: true
            fields:
              - { name: number, label: Number, type: string }
              - { name: label, label: Label, type: string }

      - name: trust
        label: Trust strip (dark bar)
        type: object
        fields:
          - { name: item1, label: Item 1 text, type: string }
          - { name: item1strong, label: Item 1 bold, type: string }
          - { name: item2, label: Item 2 text, type: string }
          - { name: item2strong, label: Item 2 bold, type: string }
          - { name: item3, label: Item 3 text, type: string }
          - { name: item3strong, label: Item 3 bold, type: string }

      - name: about
        label: About section
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: paragraphs, label: "Paragraphs (you may use <strong> for bold)", type: text, list: true }
          - name: stats
            label: Stat cards
            type: object
            list: true
            fields:
              - { name: number, label: Number, type: string }
              - { name: label, label: Label, type: string }
              - { name: accent, label: "Highlight (blue card)?", type: boolean }
          - { name: partnerTitle, label: Partner box title, type: string }
          - { name: partnerText, label: "Partner box text (may use <strong>)", type: text }

      - name: products
        label: Products
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Product list
            type: object
            list: true
            fields:
              - { name: name, label: Product name, type: string }
              - { name: tag, label: "Short tag (corner label and chip)", type: string }
              - { name: description, label: Description, type: text }
              - { name: image, label: Photo, type: image }

      - name: sourcing
        label: Sourcing section
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - name: items
            label: Source countries
            type: object
            list: true
            fields:
              - { name: flag, label: Flag emoji, type: string }
              - { name: name, label: Country, type: string }
              - { name: note, label: Note, type: string }

      - name: proforma
        label: Request-proforma section
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtext, label: Sub-text, type: text }
          - { name: assurance1, label: Assurance line 1, type: string }
          - { name: assurance3, label: Assurance line 3, type: string }

      - name: contact
        label: Contact details
        type: object
        fields:
          - { name: eyebrow, label: Small label, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro text, type: text }
          - { name: address, label: Address, type: string }
          - { name: email, label: Email, type: string }
          - { name: phoneDisplay, label: "Phone (as shown)", type: string }
          - { name: phoneTel, label: "Phone (dial format, e.g. +250782028888)", type: string }
          - { name: whatsapp, label: "WhatsApp number (digits only, e.g. 250782028888)", type: string }
          - { name: hours, label: Working hours, type: string }
          - { name: mapQuery, label: "Map search (e.g. Kigali,Rwanda or a pin)", type: string }

      - name: footer
        label: Footer
        type: object
        fields:
          - { name: tagline, label: Footer tagline, type: text }
